name: Crear APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/crear-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crear-apk-main
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Preparar descarga directa
        run: cp app/build/outputs/apk/debug/app-debug.apk calculadora-infantil.apk

      - name: Publicar versión instalable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 || gh release create v1.0 --title "Calculadora feliz 1.0" --notes "Primera versión instalable para Android."
          gh release upload v1.0 calculadora-infantil.apk --clobber

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-infantil-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

